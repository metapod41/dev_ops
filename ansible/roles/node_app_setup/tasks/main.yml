---
# Tasks for node_app_setup: install Node.js, deploy todo-api, run it with systemd.

# --- 1. Prerequisites -------------------------------------------------------
- name: Install prerequisites (curl, ca-certificates, gnupg)
  ansible.builtin.apt:
    name: [curl, ca-certificates, gnupg]
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

# --- 2. Node.js 18 from NodeSource ------------------------------------------
- name: Check installed Node.js version
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false
  failed_when: false

- name: Set fact - is Node.js {{ node_major_version }} already installed?
  ansible.builtin.set_fact:
    node_installed: "{{ node_version.rc == 0 and node_version.stdout.startswith('v' ~ node_major_version) }}"

- name: Add NodeSource GPG key
  ansible.builtin.get_url:
    url: "{{ nodesource_key_url }}"
    dest: "{{ nodesource_keyring }}"
    mode: "0644"
  when: ansible_os_family == "Debian" and not node_installed

- name: Add NodeSource repository for Node.js {{ node_major_version }}
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ nodesource_keyring }}] https://deb.nodesource.com/node_{{ node_major_version }}.x nodistro main"
    filename: nodesource
    state: present
  when: ansible_os_family == "Debian" and not node_installed

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian" and not node_installed

# --- 3. App user and directory ----------------------------------------------
- name: Create system user {{ app_user }}
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: yes
    shell: /usr/sbin/nologin
    create_home: no

- name: Create application directory {{ app_dir }}
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

# --- 4. Deploy application files ---------------------------------------------
- name: Copy application files to {{ app_dir }}
  ansible.builtin.copy:
    src: "{{ artifact_src }}{{ item }}"
    dest: "{{ app_dir }}/"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: preserve
  loop: "{{ app_files }}"
  notify: Restart todo-api

- name: Install production dependencies (npm ci --omit=dev)
  ansible.builtin.command:
    cmd: npm ci --omit=dev
    chdir: "{{ app_dir }}"
    creates: "{{ app_dir }}/node_modules"
  # Runs as root: nodeapp has no home dir for an npm cache, and becoming an
  # unprivileged user often fails on WSL. Ownership is fixed in the next task.
  notify: Restart todo-api

- name: Give {{ app_user }} ownership of {{ app_dir }}
  ansible.builtin.file:
    path: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    recurse: yes

# --- 5. systemd service ------------------------------------------------------
- name: Install systemd unit for {{ app_name }}
  ansible.builtin.template:
    src: todo-api.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart todo-api

# Run pending handlers now so the unit is loaded before we start it
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure {{ app_name }} is enabled and started
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: yes
    state: started

# --- 6. Verify ---------------------------------------------------------------
- name: Wait for port {{ app_port }} to open
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    host: 127.0.0.1
    timeout: 30

- name: Check GET /health
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    return_content: yes
    status_code: 200
  register: health_check

- name: Show health check response
  ansible.builtin.debug:
    var: health_check.json
