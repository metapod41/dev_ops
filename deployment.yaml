apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api-deployment
  labels:
    app: todo-api
  annotations:
    kubernetes.io/change-cause: "Initial deployment of todo-api:latest"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo-api
  # Rolling update: start one new pod at a time and never drop below the
  # desired replica count, so the API stays available during updates.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          image: todo-api:latest
          # IfNotPresent: use the image built inside Minikube's Docker daemon
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # Deployment enhancement: ConfigMap -> environment variables
          envFrom:
            - configMapRef:
                name: todo-api-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Deployment enhancement: health probes
          # Readiness: send traffic to the pod only once /health answers.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: restart the container if /health stops answering.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
