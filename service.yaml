# Exposes the todo-api pods outside the cluster on <node-ip>:30080.
apiVersion: v1
kind: Service
metadata:
  name: todo-api-service
  labels:
    app: todo-api
spec:
  type: NodePort
  selector:
    app: todo-api
  ports:
    - protocol: TCP
      port: 80          # port inside the cluster
      targetPort: 3000  # containerPort in the pod
      nodePort: 30080   # port on the node (range 30000-32767)
